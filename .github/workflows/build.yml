name: build-LietY2
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc binutils grub-pc-bin grub-common xorriso mtools qemu-system-x86

      - name: Build real bootable ISO
        run: make

      - name: Verify 20 GiB logical ISO
        run: |
          test -f LietY2-x86_64.iso
          test "$(stat -c%s LietY2-x86_64.iso)" -eq 21474836480
          du -h LietY2-x86_64.iso

      - name: Prepare persistent test disk
        run: truncate -s 64M LietY2-disk.img

      - name: QEMU boot + AHCI + LYFS + ring3 + syscall smoke test
        shell: bash
        run: |
          set +e
          timeout 12s qemu-system-x86_64 \
            -M q35 -m 128M \
            -cdrom LietY2-x86_64.iso \
            -drive file=LietY2-disk.img,if=none,id=disk,format=raw \
            -device ich9-ahci,id=sata0 \
            -device ide-hd,bus=sata0.0,drive=disk \
            -serial stdio -debugcon file:qemu-debugcon.log -global isa-debugcon.iobase=0xe9 \
            -display none -boot d -d in_asm,int,cpu_reset -D qemu-debug.log > qemu.log 2>&1
          rc=$?
          set -e
          cat qemu.log
          cat qemu-debugcon.log || true
          echo "--- QEMU exception context ---"
          grep -n -m 3 -B 12 -A 45 "check_exception" qemu-debug.log || true
          echo "--- QEMU reset context ---"
          grep -n -m 3 -B 4 -A 20 "Triple fault" qemu-debug.log || true
          test "$rc" -eq 124 -o "$rc" -eq 0
          grep -q "LietY2 2.0" qemu.log
          grep -q "LYFS mounted." qemu.log
          grep -q "Starting INIT in ring 3" qemu.log
          grep -q "INIT.LYE: jestem w ring3." qemu.log
          grep -q "filesystem syscall dzialaja" qemu.log
          grep -q "Ring3 napisal ten plik na prawdziwym dysku." qemu.log
          grep -q "INIT returned to kernel." qemu.log

      - uses: actions/upload-artifact@v4
        with:
          name: LietY2-build
          path: |
            build/kernel.elf
            qemu.log
            qemu-debugcon.log
            qemu-debug.log
